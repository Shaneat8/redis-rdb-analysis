# Mode 1 — Stock AOF everysec.
# Used as the primary baseline AND as the Redis instance underneath the
# SGC client (the design says Redis is unchanged).
port 17501
daemonize no
dir /tmp/exp5_baseline
dbfilename dump.rdb
save ""
appendonly yes
appendfilename appendonly.aof
appendfsync everysec
no-appendfsync-on-rewrite no
loglevel notice
logfile /tmp/exp5_baseline/server.log
