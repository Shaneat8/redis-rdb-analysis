# NOTE: Renamed for clarity. The current name is sgc.conf.
# Contents are identical to sgc.conf — this file is kept only so
# older scripts that reference "improved.conf" still work. The
# durability upgrade lives entirely in src/sgc_client.py; the Redis
# server itself is unchanged from the everysec baseline.
port 17502
daemonize no
dir /tmp/exp5_sgc
dbfilename dump.rdb
save ""
appendonly yes
appendfilename appendonly.aof
appendfsync everysec
no-appendfsync-on-rewrite no
loglevel notice
logfile /tmp/exp5_sgc/server.log
