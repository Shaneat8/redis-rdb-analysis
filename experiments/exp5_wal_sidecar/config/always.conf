# Mode 2 — Maximum-safety stock Redis: AOF appendfsync always.
# Per-write fsync on the server side; gives near-zero data loss but
# imposes a fsync per SET reply.
port 17503
daemonize no
dir /tmp/exp5_always
dbfilename dump.rdb
save ""
appendonly yes
appendfilename appendonly.aof
appendfsync always
no-appendfsync-on-rewrite no
loglevel notice
logfile /tmp/exp5_always/server.log
