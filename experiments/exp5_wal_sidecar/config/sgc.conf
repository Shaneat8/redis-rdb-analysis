# Mode 3 — Selective Group-Commit Durability Sidecar.
# Redis itself is configured EXACTLY like everysec — the durability
# upgrade lives entirely in the client (SgcClient). This config exists
# only because the SGC server runs on its own port for parallel testing
# alongside the everysec baseline; in production both modes share one
# Redis instance.
port 17502
daemonize no
dir /tmp/exp5_sgc
dbfilename dump.rdb
save ""
appendonly yes
appendfilename appendonly.aof
appendfsync everysec
no-appendfsync-on-rewrite no
loglevel notice
logfile /tmp/exp5_sgc/server.log
