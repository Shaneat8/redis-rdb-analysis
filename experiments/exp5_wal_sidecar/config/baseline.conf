# NOTE: Renamed for clarity. The current name is everysec.conf.
# Contents are identical to everysec.conf — this file is kept only
# so older scripts that reference "baseline.conf" still work.
port 17501
daemonize no
dir /tmp/exp5_baseline
dbfilename dump.rdb
save ""
appendonly yes
appendfilename appendonly.aof
appendfsync everysec
no-appendfsync-on-rewrite no
loglevel notice
logfile /tmp/exp5_baseline/server.log
