# Experiment 2 — modified runs were generated programmatically per threshold.
# Per-run conf written to /tmp/exp2_t<THRESH>/redis.conf, structure below
# (only `hash-max-ziplist-entries` varied across the sweep):
#
# port 17110
# daemonize no
# dir /tmp/exp2_t<THRESH>
# dbfilename dump.rdb
# save ""
# appendonly no
# hash-max-ziplist-entries <THRESH>     # ← swept: 32, 64, 128, 256, 512
# hash-max-ziplist-value 64
# loglevel warning
# logfile /tmp/exp2_t<THRESH>/server.log
#
# Note on naming: this analysis runs against Redis 6.2 where the small-hash
# encoding is still called "ziplist". The same directive was renamed to
# `hash-max-listpack-entries` in Redis 7.0 when ziplist was replaced by
# listpack. The semantics for our purposes (entry-count threshold below which
# a packed encoding is used) are identical.
