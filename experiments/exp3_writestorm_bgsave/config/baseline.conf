# Experiment 3 — baseline (intentionally misconfigured: disable
# incremental fsync to amplify the write-storm cost)
port 17201
daemonize no
dir /tmp/exp3_baseline
dbfilename dump.rdb
save ""
appendonly no
rdb-save-incremental-fsync no
maxmemory-policy noeviction
loglevel notice
logfile /tmp/exp3_baseline/server.log
